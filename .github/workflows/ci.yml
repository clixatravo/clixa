# SOC-05 — Intégration continue.
#
# Trois vérifications sur chaque push et chaque pull request : les types, les
# règles de lint (dont l'étanchéité src/data → src/lib), et le build complet.
# Le build est la vérification la plus forte : typedRoutes y casse sur tout
# lien mort, et les 31 pages sont réellement générées.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, format, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vérifier le formatage
        run: npm run format:check

      - name: Build
        # Le build interroge la base pour pré-générer les pages. Quand un champ
        # vient d'être ajouté au modèle mais que le schéma n'a pas encore été
        # poussé sur la base de production, PostgreSQL répond 42P01 (table
        # absente) ou 42703 (colonne absente) — et Next enterre la cause sous
        # deux cents lignes de trace. Trois déploiements ont été perdus ainsi
        # le 22 août 2026 avant que le diagnostic ne soit posé.
        #
        # On garde donc la sortie, et on nomme la cause quand c'est celle-là.
        run: |
          set -o pipefail
          # Le test d'un `if` suspend le -e de GitHub : sans lui, l'échec du
          # build sortirait du script avant le diagnostic.
          if npm run build 2>&1 | tee /tmp/build.log; then
            exit 0
          fi
          if grep -qE '42P01|42703|does not exist' /tmp/build.log; then
            manquant=$(grep -oE 'relation "[^"]+" does not exist|column "[^"]+" does not exist' /tmp/build.log | head -1)
            echo "::error title=Le schéma de la base est en retard sur le code::${manquant:-Une table ou une colonne attendue par le modele est absente de la base.} Pousser le schéma sur la base AVANT ce build — voir « La base passe avant le code » dans CLAUDE.md."
          fi
          exit 1
        env:
          # Payload refuse de démarrer sans ces deux valeurs.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SITE_ENV: preview

  # ── Les parcours, joués pour de vrai ──────────────────────────────────────
  #
  # Cinquante-neuf épreuves qui ouvrent des comptes, retiennent des places et
  # annoncent des transferts. Elles ne tournaient que sur le poste de travail,
  # c'est-à-dire quand on y pensait.
  #
  # ⚠️ Elles écrivent dans la branche `dev`, jamais dans la production : c'est
  # ce que désigne le secret DATABASE_URL, vérifié le 27 août 2026. En plus de
  # cela, `e2e/garde.ts` refuse de démarrer si l'hôte est celui de la
  # production — la protection ne tient donc pas au seul réglage du secret.
  #
  # Les données créées portent une adresse en @epreuve.invalid et sont retirées
  # en fin de série. Une série interrompue peut en laisser : la suivante les
  # emporte, le ménage effaçant par marque et non par exécution.
  #
  # Tâche séparée du build : un parcours cassé et une compilation cassée ne se
  # lisent pas de la même manière, et on veut savoir laquelle des deux.
  epreuves:
    name: Parcours (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer le navigateur
        run: npx playwright install --with-deps chromium

      - name: Jouer les parcours
        run: npm run epreuves
        env:
          CI: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SITE_ENV: preview
          # ⚠️ Faux exprès. Il ne sert qu'à allumer le chemin de code : sans
          # lui, la garde « aucune mesure sans accord » resterait verte en
          # mesurant un pixel éteint. L'épreuve coupe de toute façon les
          # requêtes vers Meta — le vrai identifiant ne doit jamais recevoir
          # d'événements d'épreuve.
          NEXT_PUBLIC_META_PIXEL_ID: "0000000000000000"

      # Le rapport ne sert qu'en cas d'échec : c'est là qu'on veut la capture
      # d'écran et la trace, pas dans les vingt exécutions qui passent.
      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-epreuves
          path: platform/playwright-report
          retention-days: 7
